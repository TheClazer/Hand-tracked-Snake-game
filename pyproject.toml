[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snakehands"
version = "1.0.0"
description = "Classic Snake, steered with your actual hand. Pygame + OpenCV + cvzone."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rayyan Ahmed Shaikh", email = "therayyn16@gmail.com" }]
requires-python = ">=3.11"
keywords = ["snake", "game", "pygame", "opencv", "cvzone", "hand-tracking", "computer-vision"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Arcade",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "cvzone==1.6.1",
    "mediapipe==0.10.21",
    "opencv-contrib-python==4.11.0.86",
    "opencv-python==4.12.0.88",
    "pygame==2.6.1",
    "numpy==1.26.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
snakehands = "snake.game:run"

[project.urls]
Homepage = "https://github.com/TheClazer/Hand-tracked-Snake-game"
Issues = "https://github.com/TheClazer/Hand-tracked-Snake-game/issues"

[tool.setuptools.packages.find]
include = ["snake*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
source = ["snake"]
omit = [
    "snake/renderer.py",  # pygame rendering — needs a display, skip in coverage
    "snake/game.py",      # main loop — integration tested manually
    "snake/controllers.py",  # hardware deps (cv2, cvzone)
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["tests/"]
ignore_missing_imports = true
