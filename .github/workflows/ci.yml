name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            pyproject.toml

      - name: Install OS-level deps for headless pygame
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev xvfb

      - name: Install test deps (skip heavy CV stack)
        # We don't install mediapipe/opencv/cvzone in CI — the pure-logic tests
        # don't need them. The renderer/controllers modules are excluded from
        # coverage (see pyproject.toml).
        run: |
          python -m pip install --upgrade pip
          pip install pygame==2.6.1 numpy==1.26.4 pytest pytest-cov

      - name: Run tests with coverage
        run: |
          SDL_VIDEODRIVER=dummy pytest --cov=snake --cov-report=term-missing

  lint:
    name: Lint + type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pygame==2.6.1 numpy==1.26.4

      - name: Ruff lint
        run: ruff check snake tests

      - name: Mypy type check
        run: mypy snake
